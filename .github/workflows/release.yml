name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: witchs-trial-windows-x86_64.zip
            binary_path: target/release/witchs-trial.exe
          - os: ubuntu-latest
            artifact_name: witchs-trial-linux-x86_64.tar.gz
            binary_path: target/release/witchs-trial
          - os: macos-latest
            artifact_name: witchs-trial-macos-universal.tar.gz
            binary_path: target/release/witchs-trial

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux Graphics Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libasound2-dev libudev-dev pkg-config

      - name: Verify Compilation
        run: cargo check

      - name: Verify Code Quality
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item target/release/witchs-trial.exe staging/
          Copy-Item LICENSE staging/
          Copy-Item CREDITS.txt staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}
          Get-FileHash -Path ${{ matrix.artifact_name }} -Algorithm SHA256 | Out-File -FilePath "${{ matrix.artifact_name }}.sha256"

      - name: Package Unix Binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/release/witchs-trial staging/
          cp LICENSE staging/
          cp CREDITS.txt staging/
          tar -czf ${{ matrix.artifact_name }} -C staging .
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Structured Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            # Witch's Trial v0.4.2

            Automated multi-platform binary release built with wgpu and winit in Rust.

            ## What's New Since v0.4.1
            - **Audio Subsystem & Volume Controls:** Added disk-and-embedded audio playback via `rodio 0.23.0` (`wav`/`vorbis`), looping menu/level music with pause handling, 12 gameplay/UI SFX triggers, independent `Music Volume` and `SFX Volume` (0-100%) settings in `settings.cfg`, and `CREDITS.txt`.
            - **Crate Dash Audio Spam Fix:** Added a single-trigger-per-dash guard in `Player` when dashing into wall-blocked crates, backed by per-event cooldowns in `AudioSystem`.
            - **Single Standalone Executable:** Embedded the entire `assets/` tree into the binary via `include_dir` (hybrid disk-override + embedded fallback) across Windows, Linux, and macOS, with `settings.cfg` persisted beside the executable.
            - **Tests:** Expanded the headless unit test suite to 58 passing tests.

            ## Architecture Overview
            - Pure platformer precision physics with sub-stepped AABB collision detection (8 px threshold).
            - Horizontal tile collider merging eliminating ghost-vertex snagging.
            - Dual-form player kinematics and Finite State Machine (Idle, Walk, Jump, Fall, WallSlide, DashFreeze, Dash) with The Beast transformation and damage i-frames.
            - Pushable crates (PushableBox) with 2D sub-stepped physics, chain pushing, and friction-based slide deceleration.
            - Classic PSX post-processing shader with 15-bit RGB555 quantization, 4x4 ordered Bayer dithering, soft scanlines, and corner vignette.
            - Audio subsystem built on `rodio 0.23.0` (`wav`/`vorbis`) supporting looping music, in-memory cached SFX with cooldowns, and silent headless fallback.
            - Single standalone binary packaging via `include_dir` embedding all `assets/` with optional disk overrides and executable-adjacent `settings.cfg`.
            - Multi-backend rendering via wgpu (Vulkan, DirectX 12, Metal, OpenGL).
            - Deterministic fixed-timestep loop (30Hz-300Hz) and Dynamic mode with sub-frame interpolation.

            ## Checksums and Verification
            Each release archive is accompanied by a SHA256 checksum file. Verify integrity using:
            - Windows: `Get-FileHash -Algorithm SHA256 <archive>`
            - Linux / macOS: `sha256sum -c <checksum_file>`
