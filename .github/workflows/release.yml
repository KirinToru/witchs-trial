name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: witchs-trial-windows-x86_64.zip
            binary_path: target/release/witchs-trial.exe
          - os: ubuntu-latest
            artifact_name: witchs-trial-linux-x86_64.tar.gz
            binary_path: target/release/witchs-trial
          - os: macos-latest
            artifact_name: witchs-trial-macos-universal.tar.gz
            binary_path: target/release/witchs-trial

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux Graphics Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libasound2-dev libudev-dev pkg-config

      - name: Verify Code Quality
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item target/release/witchs-trial.exe staging/
          Copy-Item -Recurse assets staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}
          Get-FileHash -Path ${{ matrix.artifact_name }} -Algorithm SHA256 | Out-File -FilePath "${{ matrix.artifact_name }}.sha256"

      - name: Package Unix Binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/release/witchs-trial staging/
          cp -r assets staging/
          tar -czf ${{ matrix.artifact_name }} -C staging .
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Structured Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            # Witch's Trial Release

            Automated multi-platform binary release built with wgpu and winit in Rust.

            ## Checksums and Verification
            Each release archive is accompanied by a SHA256 checksum file. Verify integrity using:
            - Windows: `Get-FileHash -Algorithm SHA256 <archive>`
            - Linux / macOS: `sha256sum -c <checksum_file>`

            ## Architecture Overview
            - Pure platformer precision physics with Swept AABB Continuous Collision Detection.
            - Horizontal tile collider merging eliminating ghost-vertex snagging.
            - Modular Player Finite State Machine (Idle, Walk, Jump, Fall, WallSlide, DashFreeze, Dash).
            - Multi-backend rendering via wgpu (Vulkan, DirectX 12, Metal, OpenGL).
            - Deterministic fixed-timestep loop (30Hz-300Hz) with sub-frame interpolation.
